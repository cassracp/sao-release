Correção\"},\"0.10.0\":{\"versao\":\"0.10.0\",\"data\":\"18 de Novembro de 2026\",\"secoes\":[{\"titulo\":\"O que há de novo\",\"categoriaIcone\":\"novo\",\"itens\":[{\"titulo\":\"Módulo Captura de Tela, Editor de Anotações e Histórico Pesquisável\",\"descricao\":\"O novo módulo **Captura de Tela** permite capturar regiões, janelas ou a tela inteira (`PrintScreen`), copiar texto da tela, capturar cores e fixar imagens no topo, além de contar com editor completo (textos com múltiplas linhas, balões de diálogo, passos numerados com ponteira reposicionável, setas, tarja e desfoque com edição livre de cores, bordas e tamanhos), histórico das últimas 30 capturas com busca pelo texto visível na imagem, atalhos globais personalizáveis e um tutorial guiado rápido.\"},{\"titulo\":\"Envio Direto de Capturas para ComuChat! e Reportes\",\"descricao\":\"Ao capturar uma região da tela ou concluir uma edição, você pode enviar a imagem diretamente para qualquer colega, canal ou comunidade do ComuChat! (com legenda opcional) ou abrir um novo reporte já com a imagem anexada.\"},{\"titulo\":\"Gravação de Vídeo da Tela, Anotações ao Vivo, Recorte e GIF Animado\",\"descricao\":\"Grave vídeos de até 5 minutos de uma área, janela ou tela inteira (`Ctrl + Shift + R`), ligando e desligando o microfone, o som do computador, a câmera flutuante e o destaque visual do mouse e dos cliques. Durante a gravação, abra a paleta de desenho (`Ctrl + Shift + D`) para fazer setas, círculos, retângulos ou traços livres com sumiço automático (3 segundos) ou fixos e volte ao mouse normal com `Esc`. Você também pode gravar GIFs animados de até 30 segundos, com a opção de mostrar o ponteiro do mouse e os cliques. Ao parar a gravação do GIF, a tela é liberada na hora e um aviso acompanha o processamento até o GIF ficar pronto. Os vídeos são salvos em WebM, formato aberto e fácil de compartilhar. Você ainda pode aparar o início e o fim de qualquer gravação direto pelo histórico, exportar em formato universal compatível com qualquer aparelho ou enviar direto para o ComuChat! e Reportes.\"},{\"titulo\":\"Marca d'Água DeMaria em Imagens, Vídeos e GIFs\",\"descricao\":\"Ative e posicione a marca d'água da DeMaria nas capturas de tela, vídeos e GIFs gravados, escolhendo entre os quatro cantos (tamanho discreto) ou o centro (grande e suave para manter o texto legível). Você pode definir um padrão nas preferências da Captura de Tela ou ligar, desligar e mudar a posição na hora pela barra rápida e no editor completo, sem perder a imagem original no histórico. O menu da marca d'água abre sempre dentro da área visível, mesmo com a seleção perto da borda do monitor.\"}]},{\"titulo\":\"Melhorias e Correções\",\"categoriaIcone\":\"melhoria\",\"itens\":[{\"protocolos\":[\"FB-0093\"],\"titulo\":\"Envio Instantâneo de Mensagens no ComuChat!\",\"descricao\":\"Ao apertar `Enter`, a mensagem agora aparece na conversa na mesma hora e o campo de texto fica livre imediatamente para você continuar digitando a próxima, sem atraso e sem apagar o que você começou a escrever.\"},{\"titulo\":\"Download de Vídeos em Formato Original ou WebM\",\"descricao\":\"Ao baixar vídeos anexados na **Central de Reportes**, você agora pode escolher entre salvar no formato original (como MP4 ou MKV) ou converter automaticamente para **WebM** antes de salvar.\"},{\"titulo\":\"Gravações de Chamadas do ComuChat! Mais Leves e Compatíveis\",\"descricao\":\"Os vídeos de chamadas gravados no ComuChat! e anexos de vídeo enviados no sistema passam a ser otimizados automaticamente, ocupando menos espaço e abrindo rapidamente em qualquer computador ou celular.\"},{\"protocolos\":[\"FB-0091\"],\"titulo\":\"Agendas Canceladas na Pesquisa CTRL + K\",\"descricao\":\"Na pesquisa, agendamentos cancelados agora aparecem com destaque (título riscado e selo vermelho \\\"Cancelado\\\"), como na Agenda. Ao clicar em um deles, você é levado até a data na Agenda em vez de abrir a tela de edição. Para voltar a editar, reative o agendamento.\"},{\"protocolos\":[\"FB-0080\"],\"titulo\":\"Cor da Agenda Livre ao Cancelar\",\"descricao\":\"Ao cancelar um agendamento e gerar o bloco de Agenda Livre, ele agora nasce com a mesma cor do agendamento cancelado. Se preferir outra, a tela de cancelamento tem um seletor de cor para você escolher antes de confirmar.\"},{\"protocolos\":[\"FB-0112\"],\"titulo\":\"Estabilidade ao Abrir o Editor de Textos\",\"descricao\":\"Corrigido um erro que podia exibir uma tela de falha ao abrir o Editor de Textos, garantindo que suas abas carreguem normalmente e prontas para uso.\"},{\"protocolos\":[\"FB-0104\"],\"titulo\":\"Copiar Link da Página nas Telas Externas\",\"descricao\":\"Removida a opção nativa de compartilhamento do navegador que gerava um endereço interno incorreto e adicionada a opção **Copiar link da página** ao clicar com o botão direito nas telas da Intranet, SAC e demais páginas externas.\"}]}],\"resumoDestaque\":\"Captura de Imagens, Gravação de Vídeo e muito mais no SAO\"},\"v0.10.0\":{\"versao\":\"0.10.0\",\"data\":\"18 de Novembro de 2026\",\"secoes\":[{\"titulo\":\"O que há de novo\",\"categoriaIcone\":\"novo\",\"itens\":[{\"titulo\":\"Módulo Captura de Tela, Editor de Anotações e Histórico Pesquisável\",\"descricao\":\"O novo módulo **Captura de Tela** permite capturar regiões, janelas ou a tela inteira (`PrintScreen`), copiar texto da tela, capturar cores e fixar imagens no topo, além de contar com editor completo (textos com múltiplas linhas, balões de diálogo, passos numerados com ponteira reposicionável, setas, tarja e desfoque com edição livre de cores, bordas e tamanhos), histórico das últimas 30 capturas com busca pelo texto visível na imagem, atalhos globais personalizáveis e um tutorial guiado rápido.\"},{\"titulo\":\"Envio Direto de Capturas para ComuChat! e Reportes\",\"descricao\":\"Ao capturar uma região da tela ou concluir uma edição, você pode enviar a imagem diretamente para qualquer colega, canal ou comunidade do ComuChat! (com legenda o \":\"0.9.6\",\"data\":\"13 de Novembro de 2026\",\"secoes\":[{\"titulo\":\"O que há de novo\",\"categoriaIcone\":\"novo\",\"itens\":[{\"protocolos\":[\"FB-0017\",\"FB-0017-02\"],\"titulo\":\"Execução na Bandeja e Indicador de Alertas\",\"descricao\":\"Ao clicar no botão de fechar (`X`), o SAO permanece ativo junto ao relógio do Windows exibindo uma sinalização de alertas não lidos no ícone da bandeja e a contagem na barra de tarefas. Você pode restaurar a janela com um clique no ícone, ajustar a inicialização automática com o Windows em **Configurações → Geral** ou encerrar o aplicativo pelo menu da bandeja e pelo menu do perfil.\"},{\"protocolos\":[\"FB-0017-03\"],\"titulo\":\"Notificações Nativas do Windows\",\"descricao\":\"Quando o SAO estiver minimizado ou na bandeja do sistema, os alertas do ComuChat, Agenda, WhatsApp Corporativo, Downloads e Reportes aparecem na Central de Ações do Windows com som único e clique direto para o destino do aviso. Você pode personalizar esses alertas e as regras de WhatsApp e Downloads em **Configurações → Notificações**.\"}]}],\"resumoDestaque\":\"Build de Melhoria e Correção\"},\"v0.9.6\":{\"versao\":\"0.9.6\",\"data\":\"13 de Novembro de 2026\",\"secoes\":[{\"titulo\":\"O que há de novo\",\"categoriaIcone\":\"novo\",\"itens\":[{\"protocolos\":[\"FB-0017\",\"FB-0017-02\"],\"titulo\":\"Execução na Bandeja e Indicador de Alertas\",\"descricao\":\"Ao clicar no botão de fechar (`X`), o SAO permanece ativo junto ao relógio do Windows exibindo uma sinalização de alertas não lidos no ícone da bandeja e a contagem na barra de tarefas. Você pode restaurar a janela com um clique no ícone, ajustar a inicialização automática com o Windows em **Configurações → Geral** ou encerrar o aplicativo pelo menu da bandeja e pelo menu do perfil.\"},{\"protocolos\":[\"FB-0017-03\"],\"titulo\":\"Notificações Nativas do Windows\",\"descricao\":\"Quando o SAO estiver minimizado ou na bandeja do sistema, os alertas do ComuChat, Agenda, WhatsApp Corporativo, Downloads e Reportes aparecem na Central de Ações do Windows com som único e clique direto para o destino do aviso. Você pode personalizar esses alertas e as regras de WhatsApp e Downloads em **Configurações → Notificações**.\"}]}],\"resumoDestaque\":\"Build de Melhoria e Correção\"},\"0.9.5\":{\"versao\":\"0.9.5\",\"data\":\"13 de Novembro de 2026\",\"secoes\":[{\"titulo\":\"Melhorias e Correções\",\"categoriaIcone\":\"melhoria\",\"itens\":[{\"protocolos\":[\"FB-0053-3\"],\"titulo\":\"Chaves de Segurança Renovadas\",\"descricao\":\"Trocamos nos bastidores as chaves usadas pelo envio de e-mails de recuperação de senha e pelas chamadas de voz do ComuChat. Você não precisa fazer nada além de atualizar o SAO quando o aviso aparecer: e-mails, chamadas e compartilhamento de tela continuam funcionando como sempre.\"}]}],\"resumoDestaque\":\"Build de Melhoria e Correção\"},\"v0.9.5\":{\"versao\":\"0.9.5\",\"data\":\"13 de Novembro de 2026\",\"secoes\":[{\"titulo\":\"Melhorias e Correções\",\"categoriaIcone\":\"melhoria\",\"itens\":[{\"protocolos\":[\"FB-0053-3\"],\"titulo\":\"Chaves de Segurança Renovadas\",\"descricao\":\"Trocamos nos bastidores as chaves usadas pelo envio de e-mails de recuperação de senha e pelas chamadas de voz do ComuChat. Você não precisa fazer nada além de atualizar o SAO quando o aviso aparecer: e-mails, chamadas e compartilhamento de tela continuam funcionando como sempre.\"}]}],\"resumoDestaque\":\"Build de Melhoria e Correção\"},\"0.9.4\":{\"versao\":\"0.9.4\",\"data\":\"12 de Novembro de 2026\",\"secoes\":[{\"titulo\":\"O que há de novo\",\"categoriaIcone\":\"novo\",\"itens\":[{\"protocolos\":[\"FB-0083\"],\"titulo\":\"Recursos Configuráveis por Agenda e Painel de BI Isolado\",\"descricao\":\"As **Configurações da Agenda** ganharam a nova aba **Recursos**, onde é possível ativar ou desativar em cada agenda (pessoal, de setor ou personalizada) o **Painel de BI de Cancelamentos**, os **Campos de Implantação** e a **Fila de Espera**, mantendo apenas a agenda de **Implantações** com esses recursos ligados por padrão. O **Painel Analítico de Cancelamentos & BI** agora exibe apenas os dados da agenda aberta no momento e permite escolher onde salvar a planilha de exportação no seu computador.\"},{\"protocolos\":[\"FB-0088\"],\"titulo\":\"Card de Atualização Mais Limpo e Organizado\",\"descricao\":\"Corrigido um problema em que as notas de lançamento apareciam por completo e sem formatação dentro do aviso de nova versão, deformando o quadro na aba **Sobre & Ajuda** das **Configurações** e no alerta na tela. Agora o aviso mostra um resumo curto do que mudou, com a opção de expandir a lista organizada de novidades quando você quiser conferir os detalhes antes de atualizar.\"},{\"protocolos\":[\"FB-0085\"],\"titulo\":\"Senha sem Data de Expiração\",\"descricao\":\"Agora você consegue desligar o \\\"Expira?\\\" ao criar ou editar uma senha (antes a opção piscava e voltava marcada), e a lista do cofre mostra na hora a nova expiração depois de salvar. Se o \\\"Expira?\\\" ficar ligado sem uma data escolhida, o SAO avisa antes de salvar.\"},{\"descricao\":\"- - **[FB-0053] [FB-0053-2] Login Salvo do SAC, Intranet, PABX Web e WhatsApp Corporativo:** Depois que você clica em **Salvar Login**, o SAO passa a preencher seu usuário e senha sozinho ao abrir esses acessos, inclusive depois de fechar e reabrir o SAO. As senhas salvas agora ficam guardadas de forma protegida, e não mais legíveis no seu computador. **[FB-0053-4] Abas Web Mais Seguras:** O SAC, a Intranet, o PABX Web e o WhatsApp Corporativo continuam funcionando como sempre. Os outros sites que você abrir por links dentro deles passam a ficar isolados do SAO, sem acesso às funções internas do aplicativo, e os links continuam abrindo normalmente. \\\"Build de Melhoria e Correção\\\"\"}]},{\"titulo\":\"O que há de novo\",\"categoriaIcone\":\"novo\",\"itens\":[{\"titulo\":\"Agendamento em Sequência Repaginado\",\"descricao\":\"A tela agora tem uma área só para as sessões encontradas, em cartões com dia da semana, data, horário e responsável, para você ver todas de uma vez sem ficar rolando uma lista pequena. A busca e os dados do agendamento ficam em uma coluna ao lado, e os responsáveis viraram um filtro compacto com as mesmas siglas coloridas da Agenda.\"},{\"titulo\":\"Copiar Datas para o Cliente\",\"descricao\":\"No agendamento em sequência, o botão \\\"Copiar datas\\\" copia a lista das sessões, com dia da semana, data e horário, pronta para colar na conversa do WhatsApp com o cliente.\"},{\"titulo\":\"Trocar o Horário de uma Sessão\",\"descricao\":\"No agendamento em sequência, cada sessão tem um botão de relógio que mostra as vagas livres daquele dia, com o responsável de cada uma. Escolha outro horário e a sessão é ajustada ali mesmo, sem precisar criar tudo e corrigir depois na agenda.\"},{\"titulo\":\"Pular um Dia que o Cliente Não Pode\",\"descricao\":\"O X em cada sessão retira aquele dia da sequência e acrescenta uma nova sessão no fim, mantendo a quantidade combinada. As outras sessões ficam como estão, e você pode desfazer logo em seguida se clicar sem querer.\"},{\"titulo\":\"Nova Pesquisa de Mensagens no ComuChat!\",\"descricao\":\"A busca (`Ctrl + F`) ganhou um painel lateral completo que mostra a foto e o nome de quem enviou cada mensagem, a data e o horário exatos, os anexos e a palavra buscada destacada em amarelo, mantendo os resultados abertos ao lado da conversa enquanto você pula de uma mensagem para outra. Agora você também pode pesquisar em toda a comunidade de uma vez e filtrar rapidamente por pessoa, canal, período ou tipo de conteúdo (links, arquivos, imagens, vídeos, áudios e mensagens fixadas).\"},{\"titulo\":\"Aviso de Nova Versão Instalada\",\"descricao\":\"Toda vez que uma atualização do SAO for aplicada, um aviso verde-água no canto da tela avisa que a versão foi instalada com sucesso e convida você a ver as novidades com um clique, ficando visível até você fechar ou conferir.\"}]},{\"titulo\":\"Melhorias e Correções\",\"categoriaIcone\":\"melhoria\",\"itens\":[{\"titulo\":\"Marcação `@todos` no ComuChat!\",\"descricao\":\"Corrigido um detalhe ao marcar `@todos` nas conversas da comunidade, que antes ficava com duas arrobas (`@@todos`). Agora a marcação aparece certinho como `@todos`, tanto nas novas mensagens quanto nas que já tinham sido enviadas.\"},{\"titulo\":\"Horário Preferencial no Agendamento em Sequência\",\"descricao\":\"Corrigido um problema em que a busca sugeria o primeiro horário do dia (por exemplo, 09:00) em vez do horário preferencial que você informou, mesmo com ele livre na agenda. Isso acontecia principalmente nas segundas-feiras e depois de dias sem vaga. Agora o SAO procura o horário preferencial em cada dia da sequência. Quando o dia não tem esse horário livre, ele mantém o dia, sugere o horário livre mais próximo e marca a sessão como \\\"Fora do horário preferencial\\\", para você conferir antes de confirmar.\"},{\"titulo\":\"Autocompletar de Emojis no ComuChat!\",\"descricao\":\"Ao digitar palavras-chave iniciadas por dois pontos (como `:ok`), você pode navegar pelas sugestões com as setas do teclado e apertar `Enter` ou `Tab` para colocar o emoji escolhido no campo de texto, enviando a mensagem apenas quando apertar `Enter` novamente.\"},{\"titulo\":\"Notificações do ComuChat! que Sumiam Sozinhas\",\"descricao\":\"Corrigido um problema em que o aviso de mensagem nova (no sininho, no ícone e no atalho) piscava e desaparecia sem você ter visto a mensagem. Isso acontecia quando a aba do ComuChat! ficava aberta em segundo plano na conversa de quem escreveu. Agora a mensagem só é marcada como lida quando a conversa está de fato na sua tela.\"},{\"titulo\":\"Aviso de Mensagem Nova ao Reler a Conversa\",\"descricao\":\"Se você estiver rolando para cima para reler mensagens antigas e chegar uma nova na mesma conversa, o SAO agora avisa normalmente. Antes ela era dada como lida mesmo sem aparecer na sua tela. O aviso some assim que você volta ao fim da conversa.\"},{\"titulo\":\"Permissões e Privilégios nas Agendas de Setor\",\"descricao\":\"Corrigido um problema em que administradores, gerentes e usuários seniores não conseguiam criar ou gerenciar agendamentos nas agendas de setor. Nas **Configurações da Agenda**, agora é possível ajustar normalmente os privilégios individuais de cada colaborador e salvar preferências visuais sem mensagens de erro indevidas.\"},{\"titulo\":\"Rolagem na Janela de Trocar Horário\",\"descricao\":\"Corrigido um problema em que a rolagem do mouse não funcionava na lista de vagas livres do dia, ao trocar o horário de uma sessão no agendamento em sequência. A barrinha de rolagem aparecia, mas a lista não se movia. Agora a rolagem funciona normalmente com o mouse ou o toque.\"}]}],\"resumoDestaque\":\"Build de Melhoria e Correção\"},\"v0.9.4\":{\"versao\":\"0.9.4\",\"data\":\"12 de Novembro de 2026\",\"secoes\":[{\"titulo\":\"O que há de novo\",\"categoriaIcone\":\"novo\",\"itens\":[{\"protocolos\":[\"FB-0083\"],\"titulo\":\"Recursos Configuráveis por Agenda e Painel de BI Isolado\",\"descricao\":\"As **Configurações da Agenda** ganharam a nova aba **Recursos**, onde é possível ativar ou desativar em cada agenda (pessoal, de setor ou personalizada) o **Painel de BI de Cancelamentos**, os **Campos de Implantação** e a **Fila de Espera**, mantendo apenas a agenda de **Implantações** com esses recursos ligados por padrão. O **Painel Analítico de Cancelamentos & BI** agora exibe apenas os dados da agenda aberta no momento e permite escolher onde salvar a planilha de exportação no seu computador.\"},{\"protocolos\":[\"FB-0088\"],\"titulo\":\"Card de Atualização Mais Limpo e Organizado\",\"descricao\":\"Corrigido um problema em que as notas de lançamento apareciam por completo e sem formatação dentro do aviso de nova versão, deformando o quadro na aba **Sobre & Ajuda** das **Configurações** e no alerta na tela. Agora o aviso mostra um resumo curto do que mudou, com a opção de expandir a lista organizada de novidades quando você quiser conferir os detalhes antes de atualizar.\"},{\"protocolos\":[\"FB-0085\"],\"titulo\":\"Senha sem Data de Expiração\",\"descricao\":\"Agora você consegue desligar o \\\"Expira?\\\" ao criar ou editar uma senha (antes a opção piscava e voltava marcada), e a lista do cofre mostra na hora a nova expiração depois de salvar. Se o \\\"Expira?\\\" ficar ligado sem uma data escolhida, o SAO avisa antes de salvar.\"},{\"descricao\":\"- - **[FB-0053] [FB-0053-2] Login Salvo do SAC, Intranet, PABX Web e WhatsApp Corporativo:** Depois que você clica em **Salvar Login**, o SAO passa a preencher seu usuário e senha sozinho ao abrir esses acessos, inclusive depois de fechar e reabrir o SAO. As senhas salvas agora ficam guardadas de forma protegida, e não mais legíveis no seu computador. **[FB-0053-4] Abas Web Mais Seguras:** O SAC, a Intranet, o PABX Web e o WhatsApp Corporativo continuam funcionando como sempre. Os outros sites que você abrir por links dentro deles passam a ficar isolados do SAO, sem acesso às funções internas do aplicativo, e os links continuam abrindo normalmente. \\\"Build de Melhoria e Correção\\\"\"}]},{\"titulo\":\"O que há de novo\",\"categoriaIcone\":\"novo\",\"itens\":[{\"titulo\":\"Agendamento em Sequência Repaginado\",\"descricao\":\"A tela agora tem uma área só para as sessões encontradas, em cartões com dia da semana, data, horário e responsável, para você ver todas de uma vez sem ficar rolando uma lista pequena. A busca e os dados do agendamento ficam em uma coluna ao lado, e os responsáveis viraram um filtro compacto com as mesmas siglas coloridas da Agenda.\"},{\"titulo\":\"Copiar Datas para o Cliente\",\"descricao\":\"No agendamento em sequência, o botão \\\"Copiar datas\\\" copia a lista das sessões, com dia da semana, data e horário, pronta para colar na conversa do WhatsApp com o cliente.\"},{\"titulo\":\"Trocar o Horário de uma Sessão\",\"descricao\":\"No agendamento em sequência sessão no agendamento em sequência. A barrinha de rolagem aparecia, mas a lista não se movia. Agora a rolagem funciona normalmente com o mouse ou o toque.\"}]}],\"resumoDestaque\":\"Build de Melhoria e Correção\"},\"0.9.2\":{\"versao\":\"0.9.2\",\"data\":\"11 de Novembro de 2026\",\"secoes\":[{\"titulo\":\"O que há de novo\",\"categoriaIcone\":\"novo\",\"itens\":[{\"titulo\":\"Barra de Acesso Rápido na Lateral\",\"descricao\":\"Agora você pode fixar os módulos que mais usa na barra lateral esquerda (pela estrela nos cartões da tela inicial, pelo menu direito das abas ou na nova aba **Favoritos** das Configurações) e reordená-los como preferir arrastando com o mouse. Clique no ícone para abrir ou voltar direto à aba já aberta sem duplicar, feche rapidamente com o botão do meio do mouse ou clique com o botão direito para desacoplar em outra janela — com indicadores visuais de uso e salvamento automático na sua conta.\"},{\"titulo\":\"Botão de Tema Claro e Escuro no Topo\",\"descricao\":\"O botão para alternar entre o modo claro e o modo escuro (ícone de Sol e Lua) agora fica sempre à mão no cabeçalho superior, ao lado da busca (`Ctrl + K`), substituindo a antiga aba Aparência nas Configurações.\"},{\"titulo\":\"Edição Avançada de Tabelas no Editor de Texto\",\"descricao\":\"Agora você pode ajustar livremente a altura das linhas e a largura das colunas arrastando as bordas com o mouse ou informando medidas exatas. Também é possível mesclar ou dividir células, distribuir linhas e colunas igualmente, escolher o alinhamento vertical e personalizar cores e estilos das bordas pela barra de tabela, pelo menu de contexto ou pela janela de propriedades.\"}]},{\"titulo\":\"Melhorias e Correções\",\"categoriaIcone\":\"melhoria\",\"itens\":[{\"titulo\":\"Novo Visual nas Chamadas de Voz\",\"descricao\":\"O palco das chamadas de voz do ComuChat foi redesenhado para ficar mais limpo e elegante, exibindo ondas animadas ao lado do nome de quem está falando e o tempo de duração ao vivo no cabeçalho. Também corrigimos o recorte no contorno verde de destaque dos participantes ao falar.\"},{\"titulo\":\"Visualização de Mídias nas Solicitações\",\"descricao\":\"Imagens, vídeos e áudios anexados às solicitações agora são exibidos diretamente no SAO, sem precisar baixar o arquivo. As imagens podem ser ampliadas com um clique, com zoom e arraste para ver os detalhes.\"},{\"titulo\":\"Anexos Mais Leves\",\"descricao\":\"Imagens coladas com `Ctrl + V` ou anexadas ao abrir uma solicitação agora são otimizadas automaticamente, ocupando bem menos espaço sem perder a nitidez.\"},{\"titulo\":\"Fonte Padrão do Editor de Texto\",\"descricao\":\"O Editor de Texto agora utiliza a fonte Calibri como padrão ao digitar e ao exportar documentos, mantendo as demais opções disponíveis na barra de ferramentas.\"},{\"titulo\":\"Solicitações do Discord agora no SAO\",\"descricao\":\"Todas as solicitações abertas no antigo fórum do Discord foram trazidas para a Central de Reportes, com a data original, os prints e vídeos e o histórico da conversa. Você encontra as suas em \\\"Meus Reportes\\\" e pode acompanhar e conversar sobre elas direto pelo SAO.\"},{\"titulo\":\"Solicitações sem Duplicidade\",\"descricao\":\"Corrigido um problema que, com vários SAOs abertos ao mesmo tempo, podia registrar a mesma solicitação mais de uma vez. Agora cada solicitação é enviada uma única vez, inclusive ao usar o botão \\\"Reenviar\\\".\"},{\"titulo\":\"Botões e Interruptores Padronizados\",\"descricao\":\"Os interruptores de liga/desliga das Configurações e da Agenda agora têm o mesmo tamanho e a mesma aparência em todo o SAO: preenchidos com a cor do módulo quando ligados e apenas contornados quando desligados, fáceis de distinguir em qualquer tema, e também podem ser acionados pelo teclado. Os botões passaram a seguir um padrão único de altura, de acordo com o lugar onde aparecem.\"},{\"titulo\":\"Visual Mais Consistente e Legível\",\"descricao\":\"Os botões principais, como Salvar, Novo e Entrar, agora aparecem na cor do módulo em que você está, tanto no tema claro quanto no escuro. As cores foram ajustadas para garantir uma leitura confortável em qualquer tema (os textos brancos sobre o verde-água da Agenda, por exemplo, agora ficam bem legíveis), e o tema escuro ganhou tons de grafite mais uniformes em menus e listas. Os módulos Gerar Tópicos, Gestão Organizacional e Senhas ganharam cores novas (esmeralda, ameixa e ouro), para que os botões de salvar não se confundam mais com o vermelho dos botões de exclusão.\"},{\"titulo\":\"Dicas da Agenda Visíveis no Tema Claro\",\"descricao\":\"O nome e o tipo de cada agenda, exibidos ao passar o mouse sobre a barra lateral, ficavam invisíveis no tema claro e agora aparecem com boa leitura, assim como os rótulos \\\"Detalhes\\\" e \\\"Responsáveis\\\" dos eventos.\"}]}],\"resumoDestaque\":\"Build de Melhoria e Correção\"},\"v0.9.2\":{\"versao\":\"0.9.2\",\"data\":\"11 de Novembro de 2026\",\"secoes\":[{\"titulo\":\"O que há de novo\",\"categoriaIcone\":\"novo\",\"itens\":[{\"titulo\":\"Barra de Acesso Rápido na Lateral\",\"descricao\":\"Agora você pode fixar os módulos que mais usa na barra lateral esquerda (pela estrela nos cartões da tela inicial, pelo menu direito das abas ou na nova aba **Favoritos** das Configurações) e reordená-los como preferir arrastando com o mouse. Clique no ícone para abrir ou voltar direto à aba já aberta sem duplicar, feche rapidamente com o botão do meio do mouse ou clique com o botão direito para desacoplar em outra janela — com indicadores visuais de uso e salvamento automático na sua conta.\"},{\"titulo\":\"Botão de Tema Claro e Escuro no Topo\",\"descricao\":\"O botão para alternar entre o modo claro e o modo escuro (ícone de Sol e Lua) agora fica sempre à mão no cabeçalho superior, ao lado da busca (`Ctrl + K`), substituindo a antiga aba Aparência nas Configurações.\"},{\"titulo\":\"Edição Avançada de Tabelas no Editor de Texto\",\"descricao\":\"Agora você pode ajustar l antes no topo do canal para ninguém perder.\"},{\"titulo\":\"Formatação Rica e Emojis\",\"descricao\":\"Digite com emojis, links interativos e blocos destacados de texto.\"}]},{\"titulo\":\"🔔 Notificações\",\"categoriaIcone\":\"outro\",\"itens\":[{\"titulo\":\"Controle de Alertas por Status\",\"descricao\":\"Escolha como receber notificações (som, aviso na tela ou silêncio) para quando você estiver Disponível, Ocupado ou Ausente.\"},{\"titulo\":\"Avisos Sonoros Suaves\",\"descricao\":\"Toques delicados ao término de intervalos e pausas.\"}]},{\"titulo\":\"⚡ Sistema e Atualizações\",\"categoriaIcone\":\"outro\",\"itens\":[{\"titulo\":\"Atualizações Silenciosas\",\"descricao\":\"O SAO baixa novas versões automaticamente em segundo plano para você se manter sempre atualizado sem esforço.\"},{\"titulo\":\"Navegação em Abas\",\"descricao\":\"Abra múltiplos módulos ao mesmo tempo e alterne facilmente entre eles pela barra superior.\"}]}],\"resumoDestaque\":\"Novo Editor de Texto na Nuvem, ComuChat Turbinado e Atualizações Automáticas\"},\"v0.4.15\":{\"versao\":\"0.4.15\",\"data\":\"Agosto de 2026\",\"secoes\":[{\"titulo\":\"📝 Editor de Texto\",\"categoriaIcone\":\"outro\",\"itens\":[{\"titulo\":\"Salvamento Automático na Nuvem\",\"descricao\":\"Seus textos agora são salvos com segurança no servidor. Se formatar ou trocar de computador, seus documentos continuam disponíveis.\"},{\"titulo\":\"Proteção e Privacidade\",\"descricao\":\"Todos os documentos salvos contam com criptografia avançada.\"}]},{\"titulo\":\"💬 ComuChat\",\"categoriaIcone\":\"chat\",\"itens\":[{\"titulo\":\"Menções Inteligentes (@)\",\"descricao\":\"Chame a atenção de pessoas, setores ou cargos usando @ para falar diretamente com quem precisa.\"},{\"titulo\":\"Mensagens Fixadas\",\"descricao\":\"Fixe avisos e mensagens importantes no topo do canal para ninguém perder.\"},{\"titulo\":\"Formatação Rica e Emojis\",\"descricao\":\"Digite com emojis, links interativos e blocos destacados de texto.\"}]},{\"titulo\":\"🔔 Notificações\",\"categoriaIcone\":\"outro\",\"itens\":[{\"titulo\":\"Controle de Alertas por Status\",\"descricao\":\"Escolha como receber notificações (som, aviso na tela ou silêncio) para quando você estiver Disponível, Ocupado ou Ausente.\"},{\"titulo\":\"Avisos Sonoros Suaves\",\"descricao\":\"Toques delicados ao término de intervalos e pausas.\"}]},{\"titulo\":\"⚡ Sistema e Atualizações\",\"categoriaIcone\":\"outro\",\"itens\":[{\"titulo\":\"Atualizações Silenciosas\",\"descricao\":\"O SAO baixa novas versões automaticamente em segundo plano para você se manter sempre atualizado sem esforço.\"},{\"titulo\":\"Navegação em Abas\",\"descricao\":\"Abra múltiplos módulos ao mesmo tempo e alterne facilmente entre eles pela barra superior.\"}]}],\"resumoDestaque\":\"Novo Editor de Texto na Nuvem, ComuChat Turbinado e Atualizações Automáticas\"}},\"lista\":[{\"versao\":\"0.11.3\",\"data\":\"25 de Novembro de 2026\",\"secoes\":[{\"titulo\":\"O que há de novo\",\"categoriaIcone\":\"novo\",\"itens\":[{\"protocolos\":[\"FB-0126\",\"FB-0127\"],\"titulo\":\"Checklist Completo e Listas em Colunas nos Formulários\",\"descricao\":\"Nas perguntas de múltipla seleção do módulo Formulários, agora você pode escolher o formato Checklist completo para exibir todas as opções no documento final — marcadas com ☑ e não marcadas com ☐. Tanto o checklist quanto a lista com marcadores podem ser distribuídos automaticamente em 1, 2 ou 3 colunas sem bordas, evitando documentos extensos, e a tela de preenchimento ganhou atalhos para marcar todos ou limpar a seleção.\"}]},{\"titulo\":\"Melhorias e Correções\",\"categoriaIcone\":\"melhoria\",\"itens\":[{\"protocolos\":[\"FB-0125\"],\"titulo\":\"Login e Janelas Funcionam em Telas Pequenas\",\"descricao\":\"Em notebooks e monitores pequenos, o botão \\\"Entrar\\\" da tela de login ficava escondido e não havia como rolar a tela. Agora o login e a tela de primeiro acesso se ajustam à altura da janela e rolam quando necessário. Revisamos também outras janelas do SAO (como edição de senhas, cofres, imagens, áudio, tabelas e avatar), que agora também rolam em vez de cortar o conteúdo.\"},{\"protocolos\":[\"FB-0125-2\"],\"titulo\":\"Login com o Visual Padrão do SAO\",\"descricao\":\"Os botões da tela de login e da tela de primeiro acesso (\\\"Entrar\\\", \\\"Enviar Código\\\", \\\"Voltar ao Login\\\" e outros) agora seguem o mesmo estilo dos demais botões do SAO, com a mesma altura. Os avisos de erro e de sucesso ganharam um ícone e ficam mais fáceis de ler nos temas claro e escuro.\"}]}],\"resumoDestaque\":\"Build de Melhoria e Correção\"},{\"versao\":\"0.11.2\",\"data\":\"24 de Novembro de 2026\",\"secoes\":[{\"titulo\":\"O que há de novo\",\"categoriaIcone\":\"novo\",\"itens\":[{\"protocolos\":[\"FB-0121\"],\"titulo\":\"Use o SAO Sem Conexão com a Empresa\",\"descricao\":\"Se o SAO abrir sem VPN ou rede da empresa e você tiver usado o SAO conectado neste computador nos últimos 7 dias, a tela de erro de conexão agora oferece **Continuar sem conexão**. Nesse modo ficam disponíveis Captura de Tela, Editor de Texto, SenhaDB, Licença Temporária, Controle de Scripts SQL (pasta local e banco local), Mini Editor, Formatar Telefone, as preferências do sistema e os downloads, e o botão **Tentar reconectar**, no topo da tela, devolve todos os recursos assim que a conexão voltar. Se a conexão cair com o SAO aberto, ele passa sozinho para o modo offline e volta ao normal quando a rede retornar.\"}]},{\"titulo\":\"Melhorias e Correções\",\"categoriaIcone\":\"melhoria\",\"itens\":[{\"protocolos\":[\"FB-0124\"],\"titulo\":\"Textos Sempre Legíveis entre Modo Claro e Modo Escuro\",\"descricao\":\"Textos escritos ou colados em agendamentos, comentários, mensagens do ComuChat! e no Editor de Texto agora se ajustam automaticamente ao alternar entre o modo claro e o modo escuro. Assim, informações registradas em um tema nunca ficam invisíveis ou difíceis de ler no outro.\"},{\"protocolos\":[\"FB-0076\"],\"titulo\":\"Sinalização de Voz e Transmissão de Tela no ComuChat!\",\"descricao\":\"Agora você identifica rapidamente quando há colegas em chamada de voz ou transmitindo a tela diretamente no ícone da comunidade, na lista de membros à direita e nas conversas diretas. Quando alguém compartilha a tela, o aviso **Ao Vivo** aparece em destaque para facilitar o acompanhamento.\"}]}],\"resumoDestaque\":\"Build de Melhoria e Correção\"},{\"versao\":\"0.11.1\",\"data\":\"23 de Novembro de 2026\",\"secoes\":[{\"titulo\":\"Melhorias e Correções\",\"categoriaIcone\":\"melhoria\",\"itens\":[{\"titulo\":\"Emojis Iguais em Todo o ComuChat\",\"descricao\":\"Os emojis de reação rápida (👍 e ❤️) que aparecem ao passar o mouse sobre uma mensagem ou ao clicar com o botão direito, e os indicadores de status da lista de membros, agora têm o mesmo visual dos demais emojis do chat. O mesmo padrão foi aplicado aos rótulos e avisos com emoji em Central de Reportes, Configurações, Gerar Tópicos e ao sininho de notificações. Nas listas de seleção (que só aceitam texto), o emoji foi retirado das opções, e o texto continua igual.\"}]}],\"resumoDestaque\":\"Build de Melhoria e Correção\"},{\"versao\":\"0.11.0\",\"data\":\"23 de Novembro de 2026\",\"secoes\":[{\"titulo\":\"O que há de novo\",\"categoriaIcone\":\"novo\",\"itens\":[{\"protocolos\":[\"FB-0053-3\"],\"titulo\":\"Conexão Mais Segura e Sessão Protegida no SAO\",\"descricao\":\"O acesso ao SAO, o ComuChat! e os Scripts SQL passaram a se comunicar por uma camada central protegida, com renovação automática da sua sessão e aviso imediato quando for necessário entrar novamente ou atualizar o aplicativo. Agora também é possível encerrar todas as sessões abertas em outros computadores nas configurações da sua conta, e o envio ou download de anexos grandes no ComuChat! ficou mais estável em conexões mais lentas.\"}]},{\"titulo\":\"Melhorias e Correções\",\"categoriaIcone\":\"melhoria\",\"itens\":[{\"protocolos\":[\"FB-0103\"],\"titulo\":\"Colegas Separados por Status nas Conversas Diretas do ComuChat!\",\"descricao\":\"Na lista de conversas diretas do ComuChat!, os colegas agora são agrupados em **Disponível**, **Ocupado**, **Ausente** e **Offline** em seções recolhíveis, mantendo as conversas recentes no topo de cada grupo. Quando você recebe uma mensagem não lida — mesmo de alguém que esteja offline ou invisível —, a conversa sobe para o topo em **Não lidas** e volta para o grupo correspondente assim que você a visualiza.\"},{\"protocolos\":[\"FB-0106\"],\"titulo\":\"Aviso Visual ao Iniciar Downloads\",\"descricao\":\"Ao começar um download em qualquer tela do SAO, um balão informativo aparece logo abaixo do botão de Downloads na barra superior indicando o arquivo e permitindo abrir a lista de acompanhamento com um clique.\"},{\"protocolos\":[\"FB-0119\"],\"titulo\":\"Lembrete de WhatsApp com 1 Hora de Carência\",\"descricao\":\"Quando você cria um agendamento, reativa um cancelado ou muda a data ou o telefone dentro da janela de aviso, o lembrete automático para o cliente agora só é enviado 1 hora depois. Assim você tem tempo de corrigir ou excluir um agendamento feito por engano antes de a mensagem chegar ao cliente. Agendamentos cancelados continuam sem enviar aviso.\"}]}],\"resumoDestaque\":\"Nova arquitetura de comunicação e melhorias na experiência do SAO\"},{\"versao\":\"0.10.1\",\"data\":\"19 de Novembro de 2026\",\"secoes\":[{\"titulo\":\"Melhorias e Correções\",\"categoriaIcone\":\"melhoria\",\"itens\":[{\"titulo\":\"Emojis do ComuChat! no Mesmo Estilo em Todo Lugar\",\"descricao\":\"As reações, as sugestões de emoji ao digitar `:` e os emojis dentro das mensagens agora usam o mesmo desenho do seletor de emojis, em vez do desenho que muda conforme o seu computador.\"}]}],\"resumoDestaque\":\"Build de Melhoria e Correção\"},{\"versao\":\"0.10.0\",\"data\":\"18 de Novembro de 2026\",\"secoes\":[{\"titulo\":\"O que há de novo\",\"categoriaIcone\":\"novo\",\"itens\":[{\"titulo\":\"Módulo Captura de Tela, Editor de Anotações e Histórico Pesquisável\",\"descricao\":\"O novo módulo **Captura de Tela** permite capturar regiões, janelas ou a tela inteira (`PrintScreen`), copiar texto da tela, capturar cores e fixar imagens no topo, além de contar com editor completo (textos com múltiplas linhas, balões de diálogo, passos numerados com ponteira reposicionável, setas, tarja e desfoque com edição livre de cores, bordas e tamanhos), histórico das últimas 30 capturas com busca pelo texto visível na imagem, atalhos globais personalizáveis e um tutorial guiado rápido.\"},{\"titulo\":\"Envio Direto de Capturas para ComuChat! e Reportes\",\"descricao\":\"Ao capturar uma região da tela ou concluir uma edição, você pode enviar a imagem diretamente para qualquer colega, canal ou comunidade do ComuChat! (com legenda opcional) ou abrir um novo reporte já com a imagem anexada.\"},{\"titulo\":\"Gravação de Vídeo da Tela, Anotações ao Vivo, Recorte e GIF Animado\",\"descricao\":\"Grave vídeos de até 5 minutos de uma área, janela ou tela inteira (`Ctrl + Shift + R`), ligando e desligando o microfone, o som do computador, a câmera flutuante e o destaque visual do mouse e dos cliques. Durante a gravação, abra a paleta de desenho (`Ctrl + Shift + D`) para fazer setas, círculos, retângulos ou traços livres com sumiço automático (3 segundos) ou fixos e volte ao mouse normal com `Esc`. Você também pode gravar GIFs animados de até 30 segundos, com a opção de mostrar o ponteiro do mouse e os cliques. Ao parar a gravação do GIF, a tela é liberada na hora e um aviso acompanha o processamento até o GIF ficar pronto. Os vídeos são salvos em WebM, formato aberto e fácil de compartilhar. Você ainda pode aparar o início e o fim de qualquer gravação direto pelo histórico, exportar em formato universal compatível com qualquer aparelho ou enviar direto para o ComuChat! e Reportes.\"},{\"titulo\":\"Marca d'Água DeMaria em Imagens, Vídeos e GIFs\",\"descricao\":\"Ative e posicione a marca d'água da DeMaria nas capturas de tela, vídeos e GIFs gravados, escolhendo entre os quatro cantos (tamanho discreto) ou o centro (grande e suave para manter o texto legível). Você pode definir um padrão nas preferências da Captura de Tela ou ligar, desligar e mudar a posição na hora pela barra rápida e no editor completo, sem perder a imagem original no histórico. O menu da marca d'água abre sempre dentro da área visível, mesmo com a seleção perto da borda do monitor.\"}]},{\"titulo\":\"Melhorias e Correções\",\"categoriaIcone\":\"melhoria\",\"itens\":[{\"protocolos\":[\"FB-0093\"],\"titulo\":\"Envio Instantâneo de Mensagens no ComuChat!\",\"descricao\":\"Ao apertar `Enter`, a mensagem agora aparece na conversa na mesma hora e o campo de texto fica livre imediatamente para você continuar digitando a próxima, sem atraso e sem apagar o que você começou a escrever.\"},{\"titulo\":\"Download de Vídeos em Formato Original ou WebM\",\"descricao\":\"Ao baixar vídeos anexados na **Central de Reportes**, você agora pode escolher entre salvar no formato original (como MP4 ou MKV) ou converter automaticamente para **WebM** antes de salvar.\"},{\"titulo\":\"Gravações de Chamadas do ComuChat! Mais Leves e Compatíveis\",\"descricao\":\"Os vídeos de chamadas gravados no ComuChat! e anexos de vídeo enviados no sistema passam a ser otimizados automaticamente, ocupando menos espaço e abrindo rapidamente em qualquer computador ou celular.\"},{\"protocolos\":[\"FB-0091\"],\"titulo\":\"Agendas Canceladas na Pesquisa CTRL + K\",\"descricao\":\"Na pesquisa, agendamentos cancelados agora aparecem com destaque (título riscado e selo vermelho \\\"Cancelado\\\"), como na Agenda. Ao clicar em um deles, você é levado até a data na Agenda em vez de abrir a tela de edição. Para voltar a editar, reative o agendamento.\"},{\"protocolos\":[\"FB-0080\"],\"titulo\":\"Cor da Agenda Livre ao Cancelar\",\"descricao\":\"Ao cancelar um agendamento e gerar o bloco de Agenda Livre, ele agora nasce com a mesma cor do agendamento cancelado. Se preferir outra, a tela de cancelamento tem um seletor de cor para você escolher antes de confirmar.\"},{\"protocolos\":[\"FB-0112\"],\"titulo\":\"Estabilidade ao Abrir o Editor de Textos\",\"descricao\":\"Corrigido um erro que podia exibir uma tela de falha ao abrir o Editor de Textos, garantindo que suas abas carreguem normalmente e prontas para uso.\"},{\"protocolos\":[\"FB-0104\"],\"titulo\":\"Copiar Link da Página nas Telas Externas\",\"descricao\":\"Removida a opção nativa de compartilhamento do navegador que gerava um endereço interno incorreto e adicionada a opção **Copiar link da página** ao clicar com o botão direito nas telas da Intranet, SAC e demais páginas externas.\"}]}],\"resumoDestaque\":\"Captura de Imagens, Gravação de Vídeo e muito mais no SAO\"},{\"versao\":\"0.9.6\",\"data\":\"13 de Novembro de 2026\",\"secoes\":[{\"titulo\":\"O que há de novo\",\"categoriaIcone\":\"novo\",\"itens\":[{\"protocolos\":[\"FB-0017\",\"FB-0017-02\"],\"titulo\":\"Execução na Bandeja e Indicador de Alertas\",\"descricao\":\"Ao clicar no botão de fechar (`X`), o SAO permanece ativo junto ao relógio do Windows exibindo uma sinalização de alertas não lidos no ícone da bandeja e a contagem na barra de tarefas. Você pode restaurar a janela com um clique no ícone, ajustar a inicialização automática com o Windows em **Configurações → Geral** ou encerrar o aplicativo pelo menu da bandeja e pelo menu do perfil.\"},{\"protocolos\":[\"FB-0017-03\"],\"titulo\":\"Notificações Nativas do Windows\",\"descricao\":\"Quando o SAO estiver minimizado ou na bandeja do sistema, os alertas do ComuChat, Agenda, WhatsApp Corporativo, Downloads e Reportes aparecem na Central de Ações do Windows com som único e clique direto para o destino do aviso. Você pode personalizar esses alertas e as regras de WhatsApp e Downloads em **Configurações → Notificações**.\"}]}],\"resumoDestaque\":\"Build de Melhoria e Correção\"},{\"versao\":\"0.9.5\",\"data\":\"13 de Novembro de 2026\",\"secoes\":[{\"titulo\":\"Melhorias e Correções\",\"categoriaIcone\":\"melhoria\",\"itens\":[{\"protocolos\":[\"FB-0053-3\"],\"titulo\":\"Chaves de Segurança Renovadas\",\"descricao\":\"Trocamos nos bastidores as chaves usadas pelo envio de e-mails de recuperação de senha e pelas chamadas de voz do ComuChat. Você não precisa fazer nada além de atualizar o SAO quando o aviso aparecer: e-mails, chamadas e compartilhamento de tela continuam funcionando como sempre.\"}]}],\"resumoDestaque\":\"Build de Melhoria e Correção\"},{\"versao\":\"0.9.4\",\"data\":\"12 de Novembro de 2026\",\"secoes\":[{\"titulo\":\"O que há de novo\",\"categoriaIcone\":\"novo\",\"itens\":[{\"protocolos\":[\"FB-0083\"],\"titulo\":\"Recursos Configuráveis por Agenda e Painel de BI Isolado\",\"descricao\":\"As **Configurações da Agenda** ganharam a nova aba **Recursos**, onde é possível ativar ou desativar em cada agenda (pessoal, de setor ou personalizada) o **Painel de BI de Cancelamentos**, os **Campos de Implantação** e a **Fila de Espera**, mantendo apenas a agenda de **Implantações** com esses recursos ligados por padrão. O **Painel Analítico de Cancelamentos & BI** agora exibe apenas os dados da agenda aberta no momento e permite escolher onde salvar a planilha de exportação no seu computador.\"},{\"protocolos\":[\"FB-0088\"],\"titulo\":\"Card de Atualização Mais Limpo e Organizado\",\"descricao\":\"Corrigido um problema em que as notas de lançamento apareciam por completo e sem formatação dentro do aviso de nova versão, deformando o quadro na aba **Sobre & Ajuda** das **Configurações** e no alerta na tela. Agora o aviso mostra um resumo curto do que mudou, com a opção de expandir a lista organizada de novidades quando você quiser conferir os detalhes antes de atualizar.\"},{\"protocolos\":[\"FB-0085\"],\"titulo\":\"Senha sem Data de Expiração\",\"descricao\":\"Agora você consegue desligar o \\\"Expira?\\\" ao criar ou editar uma senha (antes a opção piscava e voltava marcada), e a lista do cofre mostra na hora a nova expiração depois de salvar. Se o \\\"Expira?\\\" ficar ligado sem uma data escolhida, o SAO avisa antes de salvar.\"},{\"descricao\":\"- - **[FB-0053] [FB-0053-2] Login Salvo do SAC, Intranet, PABX Web e WhatsApp Corporativo:** Depois que você clica em **Salvar Login**, o SAO passa a preencher seu usuário e senha sozinho ao abrir esses acessos, inclusive depois de fechar e reabrir o SAO. As senhas salvas agora ficam guardadas de forma protegida, e não mais legíveis no seu computador. **[FB-0053-4] Abas Web Mais Seguras:** O SAC, a Intranet, o PABX Web e o WhatsApp Corporativo continuam funcionando como sempre. Os outros sites que você abrir por links dentro deles passam a ficar isolados do SAO, sem acesso às funções internas do aplicativo, e os links continuam abrindo normalmente. \\\"Build de Melhoria e Correção\\\"\"}]},{\"titulo\":\"O que há de novo\",\"categoriaIcone\":\"novo\",\"itens\":[{\"titulo\":\"Agendamento em Sequência Repaginado\",\"descricao\":\"A tela agora tem uma área só para as sessões encontradas, em cartões com dia da semana, data, horário e responsável, para você ver todas de uma vez sem ficar rolando uma lista pequena. A busca e os dados do agendamento ficam em uma coluna ao lado, e os responsáveis viraram um filtro compacto com as mesmas siglas coloridas da Agenda.\"},{\"titulo\":\"Copiar Datas para o Cliente\",\"descricao\":\"No agendamento em sequência, o botão \\\"Copiar datas\\\" copia a lista das sessões, com dia da semana, data e horário, pronta para colar na conversa do WhatsApp com o cliente.\"},{\"titulo\":\"Trocar o Horário de uma Sessão\",\"descricao\":\"No agendamento em sequência, cada sessão tem um botão de relógio que mostra as vagas livres daquele dia, com o responsável de cada uma. Escolha outro horário e a sessão é ajustada ali mesmo, sem precisar criar tudo e corrigir depois na agenda.\"},{\"titulo\":\"Pular um Dia que o Cliente Não Pode\",\"descricao\":\"O X em cada sessão retira aquele dia da sequência e acrescenta uma nova sessão no fim, mantendo a quantidade combinada. As outras sessões ficam como estão, e você pode desfazer logo em seguida se clicar sem querer.\"},{\"titulo\":\"Nova Pesquisa de Mensagens no ComuChat!\",\"descricao\":\"A busca (`Ctrl + F`) ganhou um painel lateral completo que mostra a foto e o nome de quem enviou cada mensagem, a data e o horário exatos, os anexos e a palavra buscada destacada em amarelo, mantendo os resultados abertos ao lado da conversa enquanto você pula de uma mensagem para outra. Agora você também pode pesquisar em toda a comunidade de uma vez e filtrar rapidamente por pessoa, canal, período ou tipo de conteúdo (links, arquivos, imagens, vídeos, áudios e mensagens fixadas).\"},{\"titulo\":\"Aviso de Nova Versão Instalada\",\"descricao\":\"Toda vez que uma atualização do SAO for aplicada, um aviso verde-água no canto da tela avisa que a versão foi instalada com sucesso e convida você a ver as novidades com um clique, ficando visível até você fechar ou conferir.\"}]},{\"titulo\":\"Melhorias e Correções\",\"categoriaIcone\":\"melhoria\",\"itens\":[{\"titulo\":\"Marcação `@todos` no ComuChat!\",\"descricao\":\"Corrigido um detalhe ao marcar `@todos` nas conversas da comunidade, que antes ficava com duas arrobas (`@@todos`). Agora a marcação aparece certinho como `@todos`, tanto nas novas mensagens quanto nas que já tinham sido enviadas.\"},{\"titulo\":\"Horário Preferencial no Agendamento em Sequência\",\"descricao\":\"Corrigido um problema em que a busca sugeria o primeiro horário do dia (por exemplo, 09:00) em vez do horário preferencial que você informou, mesmo com ele livre na agenda. Isso acontecia principalmente nas segundas-feiras e depois de dias sem vaga. Agora o SAO procura o horário preferencial em cada dia da sequência. Quando o dia não tem esse horário livre, ele mantém o dia, sugere o horário livre mais próximo e marca a sessão como \\\"Fora do horário preferencial\\\", para você conferir antes de confirmar.\"},{\"titulo\":\"Autocompletar de Emojis no ComuChat!\",\"descricao\":\"Ao digitar palavras-chave iniciadas por dois pontos (como `:ok`), você pode navegar pelas sugestões com as setas do teclado e apertar `Enter` ou `Tab` para colocar o emoji escolhido no campo de texto, enviando a mensagem apenas quando apertar `Enter` novamente.\"},{\"titulo\":\"Notificações do ComuChat! que Sumiam Sozinhas\",\"descricao\":\"Corrigido um problema em que o aviso de mensagem nova (no sininho, no ícone e no atalho) piscava e desaparecia sem você ter visto a mensagem. Isso acontecia quando a aba do ComuChat! ficava aberta em segundo plano na conversa de quem escreveu. Agora a mensagem só é marcada como lida quando a conversa está de fato na sua tela.\"},{\"titulo\":\"Aviso de Mensagem Nova ao Reler a Conversa\",\"descricao\":\"Se você estiver rolando para cima para reler mensagens antigas e chegar uma nova na mesma conversa, o SAO agora avisa normalmente. Antes ela era dada como lida mesmo sem aparecer na sua tela. O aviso some assim que você volta ao fim da conversa.\"},{\"titulo\":\"Permissões e Privilégios nas Agendas de Setor\",\"descricao\":\"Corrigido um problema em que administradores, gerentes e usuários seniores não conseguiam criar ou gerenciar agendamentos nas agendas de setor. Nas **Configurações da Agenda**, agora é possível ajustar normalmente os privilégios individuais de cada colaborador e salvar preferências visuais sem mensagens de erro indevidas.\"},{\"titulo\":\"Rolagem na Janela de Trocar Horário\",\"descricao\":\"Corrigido um problema em que a rolagem do mouse não funcionava na lista de vagas livres do dia, ao trocar o horário de uma sessão no agendamento em sequência. A barrinha de rolagem aparecia, mas a lista não se movia. Agora a rolagem funciona normalmente com o mouse ou o toque.\"}]}],\"resumoDestaque\":\"Build de Melhoria e Correção\"},{\"versao\":\"0.9.2\",\"data\":\"11 de Novembro de 2026\",\"secoes\":[{\"titulo\":\"O que há de novo\",\"categoriaIcone\":\"novo\",\"itens\":[{\"titulo\":\"Barra de Acesso Rápido na Lateral\",\"descricao\":\"Agora você pode fixar os módulos que mais usa na barra lateral esquerda (pela estrela nos cartões da tela inicial, pelo menu direito das abas ou na nova aba **Favoritos** das Configurações) e reordená-los como preferir arrastando com o mouse. Clique no ícone para abrir ou voltar direto à aba já aberta sem duplicar, feche rapidamente com o botão do meio do mouse ou clique com o botão direito para desacoplar em outra janela — com indicadores visuais de uso e salvamento automático na sua conta.\"},{\"titulo\":\"Botão de Tema Claro e Escuro no Topo\",\"descricao\":\"O botão para alternar entre o modo claro e o modo escuro (ícone de Sol e Lua) agora fica sempre à mão no cabeçalho superior, ao lado da busca (`Ctrl + K`), substituindo a antiga aba Aparência nas Configurações.\"},{\"titulo\":\"Edição Avançada de Tabelas no Editor de Texto\",\"descricao\":\"Agora você pode ajustar livremente a altura das linhas e a largura das colunas arrastando as bordas com o mouse ou informando medidas exatas. Também é possível mesclar ou dividir células, distribuir linhas e colunas igualmente, escolher o alinhamento vertical e personalizar cores e estilos das bordas pela barra de tabela, pelo menu de contexto ou pela janela de propriedades.\"}]},{\"titulo\":\"Melhorias e Correções\",\"categoriaIcone\":\"melhoria\",\"itens\":[{\"titulo\":\"Novo Visual nas Chamadas de Voz\",\"descricao\":\"O palco das chamadas de voz do ComuChat foi redesenhado para ficar mais limpo e elegante, exibindo ondas animadas ao lado do nome de quem está falando e o tempo de duração ao vivo no cabeçalho. Também corrigimos o recorte no contorno verde de destaque dos participantes ao falar.\"},{\"titulo\":\"Visualização de Mídias nas Solicitações\",\"descricao\":\"Imagens, vídeos e áudios anexados às solicitações agora são exibidos diretamente no SAO, sem precisar baixar o arquivo. As imagens podem ser ampliadas com um clique, com zoom e arraste para ver os detalhes.\"},{\"titulo\":\"Anexos Mais Leves\",\"descricao\":\"Imagens coladas com `Ctrl + V` ou anexadas ao abrir uma solicitação agora são otimizadas automaticamente, ocupando bem menos espaço sem perder a nitidez.\"},{\"titulo\":\"Fonte Padrão do Editor de Texto\",\"descricao\":\"O Editor de Texto agora utiliza a fonte Calibri como padrão ao digitar e ao exportar documentos, mantendo as demais opções disponíveis na barra de ferramentas.\"},{\"titulo\":\"Solicitações do Discord agora no SAO\",\"descricao\":\"Todas as solicitações abertas no antigo fórum do Discord foram trazidas para a Central de Reportes, com a data original, os prints e vídeos e o histórico da conversa. Você encontra as suas em \\\"Meus Reportes\\\" e pode acompanhar e conversar sobre elas direto pelo SAO.\"},{\"titulo\":\"Solicitações sem Duplicidade\",\"descricao\":\"Corrigido um problema que, com vários SAOs abertos ao mesmo tempo, podia registrar a mesma solicitação mais de uma vez. Agora cada solicitação é enviada uma única vez, inclusive ao usar o botão \\\"Reenviar\\\".\"},{\"titulo\":\"Botões e Interruptores Padronizados\",\"descricao\":\"Os interruptores de liga/desliga das Configurações e da Agenda agora têm o mesmo tamanho e a mesma aparência em todo o SAO: preenchidos com a cor do módulo quando ligados e apenas contornados quando desligados, fáceis de distinguir em qualquer tema, e também podem ser acionados pelo teclado. Os botões passaram a seguir um padrão único de altura, de acordo com o lugar onde aparecem.\"},{\"titulo\":\"Visual Mais Consistente e Legível\",\"descricao\":\"Os botões principais, como Salvar, Novo e Entrar, agora aparecem na cor do módulo em que você está, tanto no tema claro quanto no escuro. As cores foram ajustadas para garantir uma leitura confortável em qualquer tema (os textos brancos sobre o verde-água da Agenda, por exemplo, agora ficam bem legíveis), e o tema escuro ganhou tons de grafite mais uniformes em menus e listas. Os módulos Gerar Tópicos, Gestão Organizacional e Senhas ganharam cores novas (esmeralda, ameixa e ouro), para que os botões de salvar não se confundam mais com o vermelho dos botões de exclusão.\"},{\"titulo\":\"Dicas da Agenda Visíveis no Tema Claro\",\"descricao\":\"O nome e o tipo de cada agenda, exibidos ao passar o mouse sobre a barra lateral, ficavam invisíveis no tema claro e agora aparecem com boa leitura, assim como os rótulos \\\"Detalhes\\\" e \\\"Responsáveis\\\" dos eventos.\"}]}],\"resumoDestaque\":\"Build de Melhoria e Correção\"},{\"versao\":\"0.9.1\",\"data\":\"09 de Novembro de 2026\",\"secoes\":[{\"titulo\":\"Melhorias e Correções\",\"categoriaIcone\":\"melhoria\",\"itens\":[{\"titulo\":\"Painel de Abertura de Solicitações\",\"descricao\":\"Corrigido um pequeno bug que impedia a abertura de solicitação através do painel.\"},{\"titulo\":\"Sincronização Painel de Aberutra de SOlicitações\",\"descricao\":\"Otimizada a comunicação entre o Painel de Abertura de Solicitações e o Notion (utilizado para gestão das solicitações).\"},{\"titulo\":\"Adicionado mensageria de resposta às Solicitações\",\"descricao\":\"Criado um campo para exibição das avaliações das solicitações diretamente no SAO com apoio de notificação e mensageria.\"}]}],\"resumoDestaque\":\"Build de Melhoria e Correção\"},{\"versao\":\"0.9.0\",\"data\":\"09 de Novembro de 2026\",\"secoes\":[{\"titulo\":\"O que há de novo\",\"categoriaIcone\":\"novo\",\"itens\":[{\"titulo\":\"Atalho Rápido (Ctrl + K)\",\"descricao\":\"Pressione `Ctrl + K` em qualquer tela para abrir uma busca unificada e encontrar ferramentas, conversas do _ComuChat!_, compromissos da Agenda e mais em um instante.\"},{\"titulo\":\"Tutorial Guiado\",\"descricao\":\"Adicionei um tutorial guiado para ajudar você a se familiarizar com o sistema e seus módulos.\"},{\"titulo\":\"Notas de Release\",\"descricao\":\"Adicionado esse painel que você lê! Todas as novidades e atualizações serão publicadas aqui.\"},{\"titulo\":\"Painel para abertura de solicitação\",\"descricao\":\"Agora o SAO conta com um painel interno para abertura de solicitação de melhoria (feat) e correção (bug). Basta clicar no botão no cabeçalho superior e preencher o formulário. As solicitação são organizadas por prioriedade e viabilidade e permitem adição de vários de tipos de mídia para exemplificação.\"}]},{\"titulo\":\"Melhorias e Correções\",\"categoriaIcone\":\"melhoria\",\"itens\":[{\"titulo\":\"Chamadas de Video Salvas no ComuChat!\",\"descricao\":\"Aperfeiçoei as chamadas de video do ComuChat, de modo que sejam salvas no histórico mesmo em caso de queda de conexão.\"},{\"titulo\":\"Configurações de Notificações aprimorada\",\"descricao\":\"Agora é possível configurar todas as notificações de forma independente dando total autonomia e controle. Além disso, foi corrigido um bug que fazia com que algumas notificações fossem exibidas com erro.\"}]}],\"resumoDestaque\":\"Um passo mais próximo da versão de lançamento 1.0.0\"},{\"versao\":\"0.8.x\",\"data\":\"Outubro de 2026\",\"secoes\":[{\"titulo\":\"Busca Global Instantânea (Ctrl + K)\",\"categoriaIcone\":\"sistema\",\"itens\":[{\"titulo\":\"Pesquisa de Contatos e Chat\",\"descricao\":\"Digite `@` para procurar colegas de equipe ou `#` para encontrar canais e comunidades com indicador de status em tempo real.\"},{\"titulo\":\"Consulta de Compromissos\",\"descricao\":\"Pesquise compromissos da sua Agenda rapidamente pelo nome do cliente ou assunto sem sair da tela atual.\"},{\"titulo\":\"Ações Rápidas do Sistema\",\"descricao\":\"Alterne entre tema claro e escuro, verifique atualizações, abra configurações ou reporte sugestões diretamente pela busca.\"},{\"titulo\":\"Histórico Inteligente\",\"descricao\":\"O sistema memoriza seus acessos mais frequentes para você reabrir suas ferramentas favoritas com um clique.\"}]},{\"titulo\":\"Câmera e Chamadas de Vídeo\",\"categoriaIcone\":\"sistema\",\"itens\":[{\"titulo\":\"Efeitos de Fundo Naturais\",\"descricao\":\"O desfoque de fundo e os cenários virtuais nas chamadas de vídeo do ComuChat agora recortam com muito mais precisão o cabelo e os ombros, sem tremores nem bordas borradas.\"},{\"titulo\":\"Ajuste Automático de Desempenho\",\"descricao\":\"O sistema adapta a qualidade do efeito automaticamente para garantir que a chamada continue fluida mesmo em computadores mais modestos.\"},{\"titulo\":\"Seletor de Qualidade\",\"descricao\":\"Você pode escolher entre modo Automático, Ultra (máxima qualidade), Equilibrado ou Econômico (baixo consumo).\"}]}],\"resumoDestaque\":\"Busca Rápida em Qualquer Lugar e Câmera com Qualidade de Estúdio\"},{\"versao\":\"0.7.9\",\"data\":\"Setembro de 2026\",\"secoes\":[{\"titulo\":\"📅 Agenda de Atendimentos\",\"categoriaIcone\":\"agenda\",\"itens\":[{\"titulo\":\"Busca Rápida de Clientes (CLC)\",\"descricao\":\"Encontre clientes e cartórios pesquisando por código, nome, cidade ou estado. Ao selecionar, o título e o telefone de contato são preenchidos automaticamente.\"},{\"titulo\":\"Repetição Inteligente de Compromissos\",\"descricao\":\"Crie facilmente rotinas periódicas (diárias, dias úteis, semanais, quinzenais ou mensais), com datas e regras claras no padrão do Google Calendar.\"},{\"titulo\":\"Tela Ampla e Organizada\",\"descricao\":\"O formulário de agendamento agora abre em formato confortável de tela inteira, destacando o cliente e os participantes.\"},{\"titulo\":\"Separação entre Rotinas e Horários Livres\",\"descricao\":\"Visual mais claro para diferenciar suas tarefas diárias dos blocos de vagas livres abertos para atendimentos futuros.\"},{\"titulo\":\"Gestão Flexível de Vagas\",\"descricao\":\"Ao editar um horário livre, você pode mantê-lo como vaga disponível, convertê-lo em agendamento padrão ou cancelar com segurança.\"},{\"titulo\":\"Barras de Rolagem Discretas\",\"descricao\":\"As barras de rolagem agora ficam invisíveis em repouso e surgem suavemente apenas quando você rola a página, igual ao padrão moderno do celular e do macOS.\"}]},{\"titulo\":\"💬 ual nítido com motivo e solicitante, sem depender apenas da cor.\"},{\"titulo\":\"Horários Lado a Lado\",\"descricao\":\"Atendimentos no mesmo horário agora ficam organizados lado a lado, sem tampar as informações um do outro.\"},{\"titulo\":\"Foco no Presente\",\"descricao\":\"Compromissos que já passaram ganham um tom suave e discreto para destacar o que ainda vai acontecer no dia.\"}]}],\"resumoDestaque\":\"Nova Visão de Programação na Agenda e Cores Mais Confortáveis\"},{\"versao\":\"0.7.7\",\"data\":\"Setembro de 2026\",\"secoes\":[{\"titulo\":\"💬 ComuChat\",\"categoriaIcone\":\"chat\",\"itens\":[{\"titulo\":\"Privacidade Garantida nas DMs\",\"descricao\":\"Notificações de conversas particulares agora chegam exclusivamente para quem participa da conversa.\"},{\"titulo\":\"Controle Rigoroso de Acesso\",\"descricao\":\"Apenas membros autorizados têm acesso às mensagens de canais e comunidades do seu setor.\"},{\"titulo\":\"Atualizações Mais Rápidas\",\"descricao\":\"Novidades e recados chegam de forma mais rápida e direta para cada usuário.\"}]}],\"resumoDestaque\":\"Privacidade Reforçada nas Mensagens Diretas e Maior Segurança\"},{\"versao\":\"0.7.1\",\"data\":\"Setembro de 2026\",\"secoes\":[{\"titulo\":\"📅 Agenda\",\"categoriaIcone\":\"agenda\",\"itens\":[{\"titulo\":\"Edição Direta e Sem Duplicações\",\"descricao\":\"Corrigido o fluxo de edição para atualizar o compromisso correto com um clique, sem abrir novos formulários por cima.\"},{\"titulo\":\"Exclusão Simples de Vagas\",\"descricao\":\"Botão direto para excluir horários livres sem gerar cancelamentos falsos nos relatórios.\"},{\"titulo\":\"Transformação Automática de Vagas\",\"descricao\":\"Vincule um cliente a um horário disponível para transformá-lo imediatamente em um atendimento confirmado.\"}]}],\"resumoDestaque\":\"Edição Mais Rápida de Agendamentos e Horários Livres\"},{\"versao\":\"0.7.0\",\"data\":\"Setembro de 2026\",\"secoes\":[{\"titulo\":\"📊 Relatórios e Indicadores\",\"categoriaIcone\":\" 	const REPO = 'cassracp/sao-release';
	const API_URL = `https://api.github.com/repos/${REPO}/releases`;

	// Lê as notas estruturadas compiladas estaticamente a partir do NOTAS_RELEASE.md
	let dadosNotasEstadicas = { mapa: {}, lista: [] };
	try {
		dadosNotasEstadicas = typeof dadosNotasJson === 'string' ? JSON.parse(dadosNotasJson) : dadosNotasJson;
	} catch (e) {
		console.warn('Não foi possível ler as notas estáticas:', e);
	}

	document.addEventListener('DOMContentLoaded', () => {
		ConsultarReleases();
	});

	async function ConsultarReleases() {
		try {
			const resposta = await fetch(API_URL);
			if (!resposta.ok) {
				// Se der erro (ex: 403 Rate Limit do GitHub para IP público), faz fallback para a lista estática
				console.warn('Resposta da API do GitHub não foi OK:', resposta.status);
				UsarFallbackEstatico();
				return;
			}

			const versoes = await resposta.json();

			if (!Array.isArray(versoes) || versoes.length === 0) {
				UsarFallbackEstatico();
				return;
			}

			const versaoMaisRecente = versoes[0];
			const historicoLegado = versoes.slice(1);

			RenderizarMaisRecente(versaoMaisRecente);
			RenderizarLegado(historicoLegado);

		} catch (erro) {
			console.error('Erro ao consultar releases do GitHub:', erro);
			UsarFallbackEstatico();
		} finally {
			AtualizarIconesLucide();
		}
	}

	function UsarFallbackEstatico() {
		if (dadosNotasEstadicas.lista && dadosNotasEstadicas.lista.length > 0) {
			const maisRecente = {
				tag_name: `v${dadosNotasEstadicas.lista[0].versao.replace(/^v/i, '')}`,
				published_at: dadosNotasEstadicas.lista[0].data,
				html_url: `https://github.com/${REPO}/releases/tag/v${dadosNotasEstadicas.lista[0].versao.replace(/^v/i, '')}`,
				assets: [],
				fallback: true
			};

			const legado = dadosNotasEstadicas.lista.slice(1).map(v => ({
				tag_name: `v${v.versao.replace(/^v/i, '')}`,
				published_at: v.data,
				html_url: `https://github.com/${REPO}/releases/tag/v${v.versao.replace(/^v/i, '')}`,
				assets: [],
				fallback: true
			}));

			RenderizarMaisRecente(maisRecente);
			RenderizarLegado(legado);
		} else {
			RenderizarErro();
		}
		AtualizarIconesLucide();
	}

	function AtualizarIconesLucide() {
		if (window.lucide && typeof window.lucide.createIcons === 'function') {
			window.lucide.createIcons();
		}
	}

	function FormatarData(dataString) {
		if (!dataString) return '';
		const data = new Date(dataString);
		if (isNaN(data.getTime())) {
			return dataString;
		}
		const opcoes = { day: '2-digit', month: 'long', year: 'numeric' };
		return data.toLocaleDateString('pt-BR', opcoes);
	}

	function EncontrarInstalador(assets, versaoTag) {
		if (!assets || assets.length === 0) {
			// URL canônica de download caso assets esteja vazio
			const tagLimpa = (versaoTag || '').replace(/^v/i, '');
			return {
				browser_download_url: `https://github.com/${REPO}/releases/download/v${tagLimpa}/SAO_${tagLimpa}_x64-setup.exe`
			};
		}

		return assets.find(a => a.name.endsWith('.exe') || a.name.endsWith('.msi')) ||
			   assets.find(a => a.name.endsWith('.zip')) || {
			browser_download_url: assets[0].browser_download_url
		};
	}

	function ObterNotaDaVersao(tagVersao) {
		const tagLimpa = (tagVersao || '').replace(/^v/i, '').trim();
		return dadosNotasEstadicas.mapa[tagLimpa] || dadosNotasEstadicas.mapa[`v${tagLimpa}`] || null;
	}

	function FormatarTextoInline(texto) {
		if (!texto) return '';
		let seguro = String(texto)
			.replace(/&/g, '&amp;')
			.replace(/</g, '&lt;')
			.replace(/>/g, '&gt;');

		// Substitui crases `código` por <code class="inline-code">código</code>
		seguro = seguro.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');

		// Substitui **negrito** por <strong>negrito</strong>
		seguro = seguro.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

		return seguro;
	}

	function GerarHtmlNotas(notaVersao, fallbackCorpo) {
		if (notaVersao && notaVersao.secoes && notaVersao.secoes.length > 0) {
			let html = '';

			if (notaVersao.resumoDestaque) {
				html += `
					<div class="nota-destaque">
						<i data-lucide="sparkles" style="width: 14px; height: 14px; display: inline-block; vertical-align: middle; margin-right: 6px;"></i>
						<span>&ldquo;${FormatarTextoInline(notaVersao.resumoDestaque)}&rdquo;</span>
					</div>
				`;
			}

			html += '<div class="secoes-container">';
			notaVersao.secoes.forEach(secao => {
				const isNovo = secao.categoriaIcone === 'novo';
				const nomeIcone = isNovo ? 'sparkles' : (secao.categoriaIcone === 'melhoria' ? 'wrench' : 'info');
				const classeBadge = isNovo ? 'badge-secao-novo' : 'badge-secao-melhoria';

				html += `
					<div class="secao-bloco">
						<div class="secao-badge ${classeBadge}">
							<i data-lucide="${nomeIcone}" style="width: 13px; height: 13px;"></i>
							<span>${FormatarTextoInline(secao.titulo)}</span>
						</div>
						<ul class="secao-lista">
							${secao.itens.map(item => `
								<li class="secao-item">
									${(item.protocolos && item.protocolos.length > 0)
										? item.protocolos.map(p => `<span class="badge-protocolo" title="Chamado ${FormatarTextoInline(p)}"><i data-lucide="ticket" style="width: 11px; height: 11px;"></i><span>${FormatarTextoInline(p)}</span></span>`).join('')
										: ''}
									${item.titulo ? `<strong class="item-titulo">${FormatarTextoInline(item.titulo)}:</strong> ` : ''}
									<span class="item-desc">${FormatarTextoInline(item.descricao)}</span>
								</li>
							`).join('')}
						</ul>
					</div>
				`;
			});
			html += '</div>';

			html += `
				<div class="link-devlog-wrapper">
					<a href="${baseUrl}/devlog" class="link-todas-notas">
						<span>Ver histórico completo nas Notas de Lançamento</span>
						<i data-lucide="arrow-right" style="width: 14px; height: 14px;"></i>
					</a>
				</div>
			`;

			return html;
		}

		// Fallback para body do GitHub caso não esteja no NOTAS_RELEASE.md
		if (fallbackCorpo && !fallbackCorpo.startsWith('Atualização automática do SAO')) {
			return `<div class="nota-corpo-bruto">${FormatarTextoInline(fallbackCorpo)}</div>`;
		}

		return `
			<p class="nota-vazia">
				Novidades e melhorias disponíveis nas <a href="${baseUrl}/devlog" style="color: var(--accent-color); font-weight: 600;">Notas de Lançamento</a>.
			</p>
		`;
	}

	function RenderizarMaisRecente(versao) {
		const container = document.getElementById('latest-release-container');
		const instalador = EncontrarInstalador(versao.assets, versao.tag_name);
		const urlDownload = instalador ? instalador.browser_download_url : (versao.html_url || '#');
		const notaVersao = ObterNotaDaVersao(versao.tag_name);
		const dataFormatada = FormatarData(versao.published_at || (notaVersao ? notaVersao.data : ''));

		container.innerHTML = `
			<div class="release-card latest-card">
				<div class="release-header">
					<div class="release-version">
						<i data-lucide="package"></i>
						<span>${versao.tag_name}</span>
						<span class="badge-recente">Mais Recente</span>
					</div>
					<div class="release-date">
						<i data-lucide="calendar" style="width: 14px; height: 14px;"></i>
						<span>${dataFormatada}</span>
					</div>
				</div>

				<div class="release-notes-box">
					${GerarHtmlNotas(notaVersao, versao.body)}
				</div>

				<a href="${urlDownload}" class="download-btn" target="_blank" rel="noopener noreferrer">
					<i data-lucide="download"></i>
					<span>Baixar Instalador Windows</span>
				</a>
			</div>
		`;
	}

	function RenderizarLegado(versoes) {
		const container = document.getElementById('legacy-releases-container');

		if (!versoes || versoes.length === 0) {
			container.innerHTML = '<p style="text-align:center; color: var(--text-secondary); padding: 20px;">Nenhum histórico anterior disponível.</p>';
			return;
		}

		container.innerHTML = versoes.map((versao, idx) => {
			const instalador = EncontrarInstalador(versao.assets, versao.tag_name);
			const urlDownload = instalador ? instalador.browser_download_url : (versao.html_url || '#');
			const notaVersao = ObterNotaDaVersao(versao.tag_name);
			const dataFormatada = FormatarData(versao.published_at || (notaVersao ? notaVersao.data : ''));
			const idUnico = `legado-${versao.tag_name.replace(/[^a-zA-Z0-9_-]/g, '_')}-${idx}`;

			return `
				<div class="release-card legacy-card" id="card-${idUnico}">
					<div class="release-header">
						<div class="release-version" style="font-size: 1.25rem;">
							<i data-lucide="package" style="width: 20px; height: 20px;"></i>
							<span>${versao.tag_name}</span>
						</div>
						<div class="release-date">
							<i data-lucide="calendar" style="width: 13px; height: 13px;"></i>
							<span>${dataFormatada}</span>
						</div>
					</div>

					<div class="legacy-card-actions">
						<button type="button" class="btn-toggle-notas" onclick="AlternarNotas('${idUnico}')" id="btn-${idUnico}" aria-expanded="false" aria-controls="painel-${idUnico}">
							<i data-lucide="file-text" style="width: 15px; height: 15px;"></i>
							<span class="btn-texto">Ver o que mudou nesta versão</span>
							<i data-lucide="chevron-down" style="width: 15px; height: 15px;" class="chevron-indicador"></i>
						</button>

						<a href="${urlDownload}" class="download-btn download-btn-legacy" target="_blank" rel="noopener noreferrer">
							<i data-lucide="download" style="width: 16px; height: 16px;"></i>
							<span>Download</span>
						</a>
					</div>

					<div id="painel-${idUnico}" class="painel-notas-legado" style="display: none;">
						<div class="release-notes-box legado-box">
							${GerarHtmlNotas(notaVersao, versao.body)}
						</div>
					</div>
				</div>
			`;
		}).join('');
	}

	window.AlternarNotas = function(idUnico) {
		const painel = document.getElementById(`painel-${idUnico}`);
		const botao = document.getElementById(`btn-${idUnico}`);
		if (!painel || !botao) return;

		const estaAberto = painel.style.display !== 'none';
		if (estaAberto) {
			painel.style.display = 'none';
			botao.setAttribute('aria-expanded', 'false');
			const texto = botao.querySelector('.btn-texto');
			if (texto) texto.textContent = 'Ver o que mudou nesta versão';
			botao.classList.remove('ativo');
		} else {
			painel.style.display = 'block';
			botao.setAttribute('aria-expanded', 'true');
			const texto = botao.querySelector('.btn-texto');
			if (texto) texto.textContent = 'Ocultar notas da versão';
			botao.classList.add('ativo');
		}

		AtualizarIconesLucide();
	};

	function RenderizarErro() {
		document.getElementById('latest-release-container').innerHTML = `
			<div class="erro-box">
				<i data-lucide="alert-circle" style="width: 24px; height: 24px; color: #f87171; margin-bottom: 8px;"></i>
				<p style="color: #f87171; font-weight: 500;">Não foi possível consultar os pacotes no momento.</p>
				<p style="font-size: 0.9rem; color: var(--text-secondary); margin-top: 6px;">
					Consulte diretamente as <a href="${baseUrl}/devlog" style="color: var(--accent-color);">Notas de Lançamento</a>.
				</p>
			</div>
		`;
		document.getElementById('legacy-releases-container').innerHTML = '';
	}
})();</script>
